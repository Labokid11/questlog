services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: node:22
    working_dir: /app/server
    command: sh -c "npm install && npm run dev"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/questlog
      - JWT_SECRET=base44-dev-jwt-secret-change-me
    volumes:
      - ./:/app
      - /app/server/node_modules
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
